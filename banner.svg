<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#f43f5e"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.04" stroke="#00d4ff" stroke-width="0.5">
    <line x1="0" y1="70" x2="1200" y2="70"/><line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/><line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="600" y1="0" x2="600" y2="280"/><line x1="900" y1="0" x2="900" y2="280"/>
  </g>
  <!-- Shield -->
  <g transform="translate(60,60)" filter="url(#glow)">
    <path d="M80 5 L155 35 L155 95 C155 140 115 165 80 178 C45 165 5 140 5 95 L5 35 Z"
          fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.9"/>
    <text x="80" y="105" text-anchor="middle" font-size="42" fill="#00d4ff" font-weight="bold">AI</text>
  </g>
  <!-- Title -->
  <text x="260" y="110" font-family="'Segoe UI',Arial,sans-serif" font-size="52" font-weight="800"
        fill="#e2e8f0" letter-spacing="-2">LogSentinel</text>
  <text x="760" y="110" font-family="'Segoe UI',Arial,sans-serif" font-size="52" font-weight="800"
        fill="url(#accent)" filter="url(#glow)"> AI</text>
  <rect x="260" y="120" width="540" height="3" fill="url(#accent)" rx="2" filter="url(#glow)"/>
  <text x="260" y="155" font-family="'Segoe UI',Arial,sans-serif" font-size="16" fill="#64748b">
    Real-Time Anomaly Detection in System Logs · Unsupervised ML · Production-Ready
  </text>
  <!-- Pills -->
  <g transform="translate(260,175)">
    <rect x="0" y="0" width="95" height="24" rx="12" fill="#0f2027" stroke="#00d4ff" stroke-width="0.8"/>
    <text x="47" y="16" text-anchor="middle" font-family="Arial" font-size="10" fill="#00d4ff">🔴 Real-Time</text>
    <rect x="105" y="0" width="95" height="24" rx="12" fill="#0f2027" stroke="#7c3aed" stroke-width="0.8"/>
    <text x="152" y="16" text-anchor="middle" font-family="Arial" font-size="10" fill="#a78bfa">🧠 7 ML Models</text>
    <rect x="210" y="0" width="95" height="24" rx="12" fill="#0f2027" stroke="#f43f5e" stroke-width="0.8"/>
    <text x="257" y="16" text-anchor="middle" font-family="Arial" font-size="10" fill="#fb7185">🔐 MITRE ATT&amp;CK</text>
    <rect x="315" y="0" width="95" height="24" rx="12" fill="#0f2027" stroke="#10b981" stroke-width="0.8"/>
    <text x="362" y="16" text-anchor="middle" font-family="Arial" font-size="10" fill="#34d399">💡 SHAP + LLM</text>
  </g>
  <!-- Stats -->
  <text x="260" y="225" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#475569">
    <tspan font-weight="700" fill="#e2e8f0">50K</tspan> logs/sec  
    <tspan dx="15" font-weight="700" fill="#e2e8f0">18ms</tspan> P50  
    <tspan dx="15" font-weight="700" fill="#e2e8f0">97.1%</tspan> F1-Score  
    <tspan dx="15" font-weight="700" fill="#e2e8f0">MIT</tspan> License
  </text>
  <rect x="0" y="275" width="1200" height="3" fill="url(#accent)" opacity="0.7"/>
  <!-- Anomaly dots -->
  <circle cx="1100" cy="70" r="5" fill="#f43f5e" filter="url(#glow)" opacity="0.9"/>
  <text x="1112" y="74" font-family="monospace" font-size="10" fill="#64748b">ANOMALY DETECTED</text>
  <circle cx="1100" cy="95" r="5" fill="#10b981" opacity="0.9"/>
  <text x="1112" y="99" font-family="monospace" font-size="10" fill="#64748b">NORMAL</text>
</svg>
