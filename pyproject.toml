[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "logsentinel"
version = "0.2.0"
description = "Unsupervised anomaly detection on system logs: Drain parser, classical and LSTM detectors, streaming inference"
authors = [{ name = "Aranya Ghosh" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "tabulate", "ruff"]

[tool.setuptools.packages.find]
include = ["logsentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B905", "E501"]
